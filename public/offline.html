<body><main class="card"><div class="icon">↗</div><h1>Você está sem conexão</h1><p>O Trading Pro precisa de internet para carregar operações e atualizar seus dados. Quando a conexão voltar, toque em tentar novamente.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
